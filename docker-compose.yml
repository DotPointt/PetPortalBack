version: '3.4'

networks:
  dev:

volumes:
  postgres-data:
  redis_data:
  etc-letsencrypt:

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - './PetPortalBack/nginx.conf:/etc/nginx/nginx.conf'
      - './dist:/usr/share/nginx/html'
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - petportalapi
    networks:
      - dev
    command: "/bin/sh -c 'nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  petportalapi:
    image: ${DOCKER_REGISTRY-}petportalapi
    build:
      context: .
      dockerfile: PetPortalBack/PetPortalAPI/PetPortalAPI/Dockerfile
    depends_on:
      - postgres
    networks:
      - dev
    ports:
      - "5140:8080"

  postgres:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_DB: "petportaldb"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "12345678"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dev
  
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
    networks:
      - dev
        
  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev